# CI の実体は shouni/workflows。ジョブ構成とタグ運用の理由はそちらの README にある。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      coverage: true
      # CleanJSONResponse は全ての構造化出力が通る一本道で、手で並べたケースでは
      # 文字列リテラルの走査と括弧の切り出しが絡む場所を網羅しきれない。
      fuzz-targets: ./gemini#FuzzCleanJSONResponse
      fuzz-time: 60s
