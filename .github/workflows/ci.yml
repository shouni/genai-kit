# The CI itself lives in shouni/workflows. Its README explains the job layout and how tags are used.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      coverage: true
      # CleanJSONResponse is the single path every structured output goes through, and hand-picked
      # cases cannot cover every place where string-literal scanning and bracket extraction interact.
      fuzz-targets: ./gemini#FuzzCleanJSONResponse
      fuzz-time: 60s
