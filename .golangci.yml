version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
    staticcheck:
      # SA4023 is disabled because staticcheck v0.8.0 (bundled with golangci-lint v2.13.1)
      # panics while analysing veo. It is an upstream bug where nilness's fact lookup crashes
      # on an out-of-range access, unrelated to this repository's code.
      #
      # A crash stops goanalysis_metalinter as a whole, so what is lost is not just SA4023
      # but every staticcheck check. Disabling one and keeping the rest running is the better deal.
      # When the bundled staticcheck is upgraded, check whether this line can be removed.
      checks:
        - all
        - -SA4023

formatters:
  enable:
    - gofmt
    - goimports
